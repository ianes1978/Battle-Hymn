name: battle_hymn
description: "Battle Hymn - un rhythm bullet-heaven costruito con Flutter e Flame."
publish_to: 'none'

# Versione del gioco (semver+build)
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Motore di gioco 2D
  flame: ^1.18.0
  # Riproduzione audio (qui usata per i toni delle note sintetizzati a runtime)
  audioplayers: ^6.0.0
  # Conversione di tracciati SVG in Path (chiave di violino vettoriale)
  path_drawing: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Genera le icone di lancio (Android) dall'immagine sorgente
  flutter_launcher_icons: ^0.14.1

# Configurazione delle icone di lancio (eseguita in CI per la build APK).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#2A1A4A"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  # Cartelle asset: i file vanno aggiunti dall'utente (vedi i README dedicati).
  # La registrazione delle cartelle è valida anche se contengono solo i README.
  assets:
    - assets/audio/
    - assets/images/
