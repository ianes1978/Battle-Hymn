# Builda l'Android App Bundle (.aab) FIRMATO per la pubblicazione su Google
# Play. La firma usa un keystore caricato come GitHub Secret: la chiave NON
# è mai presente nel repository.
#
# Secret richiesti (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64  -> il file .jks codificato in base64
#   ANDROID_KEYSTORE_PASSWORD-> password dello store
#   ANDROID_KEY_ALIAS        -> alias della chiave
#   ANDROID_KEY_PASSWORD     -> password della chiave
#
# Si avvia manualmente da Actions -> Build AAB (Play Store) -> Run workflow.
name: Build AAB (Play Store)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aab:
    name: Build signed AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Genera le cartelle di piattaforma (android)
        run: flutter create --platforms=android .

      - name: Configura applicationId e nome app
        run: bash tool/configure_android.sh

      - name: Installa le dipendenze
        run: flutter pub get

      - name: Genera le icone di lancio
        run: dart run flutter_launcher_icons

      - name: Decodifica il keystore dai segreti
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Segreto ANDROID_KEYSTORE_BASE64 mancante. Configura i segreti del keystore."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Abilita la firma di release
        run: python3 tool/patch_signing.py

      - name: Build App Bundle (release)
        run: flutter build appbundle --release

      - name: Carica l'AAB come artifact
        uses: actions/upload-artifact@v4
        with:
          name: battle-hymn-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Rimuovi i file sensibili
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
