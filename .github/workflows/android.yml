# Builda l'APK Android (release) e lo pubblica:
# - come artifact scaricabile dalla run (sempre);
# - come GitHub Release quando si pusha un tag v* (se i permessi lo consentono).
name: Build APK Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Genera le cartelle di piattaforma (android)
        run: flutter create --platforms=android .

      - name: Installa le dipendenze
        run: flutter pub get

      - name: Genera le icone di lancio
        run: dart run flutter_launcher_icons

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Carica l'APK come artifact
        uses: actions/upload-artifact@v4
        with:
          name: battle-hymn-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Pubblica la Release (solo su tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Battle Hymn ${{ github.ref_name }}
          files: build/app/outputs/flutter-apk/app-release.apk
          body: |
            Prima release giocabile di **Battle Hymn** per Android.

            Scarica `app-release.apk` qui sotto e installalo sul telefono
            (potrebbe servire abilitare "Installa da fonti sconosciute").
